[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-agent"
version = "0.1.0"
description = "A personal coding agent whose execution is governed by a strict, code-enforced DAG."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Kept in sync with requirements.txt.
dependencies = [
    "pydantic==2.13.5",
    "networkx==3.2.1",
    "eval_type_backport==0.4.0",
    "claude-agent-sdk==0.2.165",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
pythonpath = ["."]
