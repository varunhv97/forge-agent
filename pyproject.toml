[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-agent"
version = "0.1.0"
description = "A personal coding agent whose execution is governed by a strict, code-enforced DAG."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Kept in sync with requirements.txt.
dependencies = [
    "pydantic==2.13.5",
    "networkx==3.2.1",
    "eval_type_backport==0.4.0",
    "claude-agent-sdk==0.2.165",
    "httpx==0.28.1",
    "textual==8.2.8",
]

[project.scripts]
forge = "scripts.forge_cli:main"

[tool.setuptools.packages.find]
include = ["forge*", "scripts*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PIE", "RET",
    "PL", "ANN", "BLE", "S", "PT", "T20",
]
ignore = [
    "E501",    # black owns line length; long string literals are left alone
    "UP042",   # (str, Enum) -> StrEnum changes str() output: a behavior change
    "S603",    # subprocess calls use argv lists, never shell=True
    "S607",    # git/docker are resolved from PATH on purpose
    "PLR0913", # dispatch functions take their dependencies explicitly
    "PLR0917",
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "ANN", "ARG", "PLR", "PLC0415"]
"scripts/**" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["forge", "scripts", "tests"]

[[tool.mypy.overrides]]
# Tests are type-checked, but test functions and fixtures needn't be annotated.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
pythonpath = ["."]
# tests/tui/*'s Textual Pilot tests are plain `async def test_...` with no
# per-test marker — asyncio_mode = "auto" is pytest-asyncio's own supported
# way to run those without every other (sync) test in the suite needing
# any change at all.
asyncio_mode = "auto"
